# ─────────────────────────────────────────────────────────────────────────────
# Avino — staging overlay поверх docker-compose.prod.yml (тестовый стенд).
#
# Назначение: тест-стенд «как прод» — реальные домены, авто-TLS (Caddy), закрытый
# периметр (наружу только Caddy) и прод-сборка фронтов, — НО без настроенного
# SMTP. Поэтому сервис `api` возвращается в NODE_ENV=development: тогда код
# EMAIL-OTP пишется в лог (apps/api/src/email/email-sender.service.ts —
# `env !== 'production'` → `[DEV EMAIL → …]`), и войти можно, читая код из
# `… logs api | grep "DEV EMAIL"`, без почтового провайдера.
#
# В чистом production без SMTP письмо НЕ отправляется и НЕ логируется → войти
# нельзя. Этот overlay снимает именно эту проблему для тест-стенда.
#
# Запуск (поверх base + prod):
#   docker compose -f docker-compose.yml -f docker-compose.prod.yml \
#                  -f docker-compose.staging.yml --profile app up -d --build
#
# Merge-семантика Compose: карты `environment` объединяются по ключам, поэтому
# CORS_ORIGINS (https-домены) и прочее наследуются из prod-overlay — здесь мы
# переопределяем ТОЛЬКО NODE_ENV у `api`.
#
# Когда подключите реальный SMTP (docs/GUIDE_YANDEX_SMTP_SETUP.md) — overlay
# больше не нужен: разворачивайте чистый прод (без `-f docker-compose.staging.yml`).
# ─────────────────────────────────────────────────────────────────────────────

services:
  # seed-admin.cjs создаёт локального ADMIN, но имеет guard `NODE_ENV===production`
  # → пропускается. На тест-стенде ADMIN нужен (вход в админку/модерацию), поэтому
  # сервис `migrate` тоже в dev — тогда `migrate deploy && db seed && seed-admin`
  # реально создаст admin@avino.uz с ролью ADMIN. (db seed-справочники гонятся при
  # любом env; demo-контент — отдельно, вручную: см. deploy/README.md.)
  migrate:
    environment:
      NODE_ENV: development

  api:
    environment:
      # Только для тест-стенда: вернуть dev-режим, чтобы EMAIL-OTP попадал в лог
      # (вход без SMTP). Фронты (web/client) остаются прод-сборкой из prod-overlay.
      NODE_ENV: development
      # Тест-стенд: вход по телефону без Eskiz — OTP доставляется в Telegram
      # (admin-чат), как локально. Требует включённых Telegram-уведомлений
      # (TELEGRAM_BOT_TOKEN + TELEGRAM_ADMIN_CHAT_ID в .env + notifications-тоггл ON).
      # Код приходит в админ-чат строкой «КОД: ...». Default OFF в проде.
      OTP_TELEGRAM_DELIVERY: "true"
